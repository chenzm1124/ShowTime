version: "3.8"

# =====================================================
# 途吖 · 旅行照片AI处理工具 - 部署编排（生产）
#
# 启动：  docker compose up -d
# 停止：  docker compose down
# 重启：  docker compose restart backend
# 日志：  docker compose logs -f backend
#
# 说明：
# - postgres / redis / backend 一并编排，backend 启动会自动 alembic 建表 + seed
# - 已设为 production + 关闭 mock，切勿改回 development
# - 上线还需在前方加 Nginx 反代并配置 HTTPS 域名（见部署文档）
# =====================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: travelphoto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: travelphoto
      POSTGRES_PASSWORD: travelphoto
      POSTGRES_DB: travelphoto
      # 让 PG 接受更宽松的连接（开发用）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelphoto -d travelphoto"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travelphoto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelphoto-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 容器内部通过 service name 访问
      DATABASE_URL: postgresql+asyncpg://travelphoto:travelphoto@postgres:5432/travelphoto
      DATABASE_URL_SYNC: postgresql://travelphoto:travelphoto@postgres:5432/travelphoto
      REDIS_URL: redis://redis:6379/0
      # ⚠️ 生产配置：必须 production + mock 关闭
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: INFO
      # 上线后改为你的小程序后台「服务器域名」里的 Web 域名（如有 Web 管理端）；
      # 微信小程序走 wx.request 不校验 CORS，此项主要影响管理后台。
      CORS_ORIGINS: "*"
      # ⚠️ 生产必须 false，否则微信登录/支付/AI 流水线全走假数据
      ENABLE_MOCK_MODE: "false"
      # 本地自测占位密钥（生产请改用环境变量/secret 注入真实随机串，至少32位）
      SECRET_KEY: "local-dev-only-secret-key-please-change-in-production-32+"
    ports:
      - "8000:8000"
    # 生产不挂载本地源码，使用镜像内打包的代码
    command: >
      sh -c "python -m scripts.init_db --seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
    name: travelphoto_postgres_data
  redis_data:
    name: travelphoto_redis_data
