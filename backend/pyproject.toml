[project]
name = "travel-photo-backend"
version = "0.1.0"
description = "途吖 · 旅行照片AI处理工具 后端服务"
authors = [{ name = "Travel Photo Team" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Web 框架
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # 配置 & 校验
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # 数据库
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Redis
    "redis>=5.2.0",

    # 鉴权
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # 微信生态
    "wechatpy>=1.8.18",
    "cryptography>=43.0.0",

    # 对象存储（阿里云 OSS / 腾讯云 COS）
    "oss2>=2.19.0",
    "cos-python-sdk-v5>=1.9.30",

    # 图像质量评估（本地 CV 基线：模糊/曝光/去重哈希）
    "numpy>=1.26.0",
    "Pillow>=10.0.0",

    # HTTP 客户端
    "httpx>=0.27.0",
    "tenacity>=9.0.0",

    # 工具
    "python-multipart>=0.0.18",
    "loguru>=0.7.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipython>=8.30.0",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "RET", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true
