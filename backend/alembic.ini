# Alembic configuration
[alembic]
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is set from settings.DATABASE_URL at runtime (see env.py)
sqlalchemy.url =

# output file template
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# skip generation timestamp
timezone = Asia/Shanghai
truncate_slug_length = 40

[post_write_hooks]
# format generated migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 110

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
